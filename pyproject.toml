[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "se-admiten-humanos"
version = "0.16.2"
description = "Explainable pet-friendly rental alerts with safe outreach workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = []

[project.scripts]
se-admiten-humanos = "se_admiten_humanos.cli:main"
